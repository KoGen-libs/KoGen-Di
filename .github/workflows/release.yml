name: Publish to mavencentral

on:
  push:
    tags:
      - '*'

env:
  JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
  JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
  JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
  JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME }}
  JRELEASER_MAVENCENTRAL_TOKEN: ${{ secrets.JRELEASER_MAVENCENTRAL_SONATYPE_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build and create artifacts
        run: ./gradlew :koGenDi:publish

      - name: Extract GroupId from gradle.properties
        id: props # Даем этому шагу ID, чтобы ссылаться на его результат
        run: |
          echo "group_id=$(grep '^GROUP=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: Release with JReleaser
        uses: jreleaser/release-action@v2
        with:
          arguments: full-release
        env:
          PROJECT_GROUP_ID: ${{ steps.props.outputs.group_id }}